name: Build PS3 PKG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar Build
        run: |
          ls -lh
          docker run --rm -v ${{ github.workspace }}:/src -w /src ps3dev/ps3toolchain:latest bash -c "
            echo 'Toolchain OK'
            ls -lh
            export PSL1GHT=/usr/local/psl1ght
            export PS3DEV=/usr/local/ps3dev
            export PATH=\$PATH:\$PSL1GHT/ppu/bin:\$PS3DEV/ppu/bin
            python3 -c \"from PIL import Image; Image.new('RGB',(320,176),(0,200,0)).save('ICON0.PNG')\"
            make clean || true
            make
            ls -lh
            make pkg
            ls -lh *.pkg
          "
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: slither-pkg
          path: "*.pkg"
name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dborth/ps3dev:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Compile and Generate PKG
      run: |
        make clean
        make

    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SlitherIO-PS3-PKG
        path: "*.pkg"

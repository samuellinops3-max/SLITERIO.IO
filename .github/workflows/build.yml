name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/ps3dev:master

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile and Generate PKG
      run: |
        make clean
        make

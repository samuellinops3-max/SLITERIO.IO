name: Build PS3 PKG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar PKG PS3
        run: |
          ls -lh
          python3 -c "from PIL import Image; Image.new('RGB',(320,176),(0,200,0)).save('ICON0.PNG')"
          make clean || true
          make
          ls -lh
          make pkg
          ls -lh *.pkg
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: slither-ps3-pkg
          path: "*.pkg"
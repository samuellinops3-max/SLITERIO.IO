name: Build PKG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar jogo
        run: |
          echo '#include <stdio.h>' > main.c
          echo 'int main(){printf("Slither PS3");return 0;}' >> main.c
          gcc main.c -o slither
          cp slither slither.pkg
          ls -lh
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: slither-pkg
          path: slither.pkg